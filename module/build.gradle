import org.apache.tools.ant.filters.FixCrLfFilter

import java.nio.file.Files
import java.nio.file.StandardCopyOption

apply plugin: 'com.android.library'
apply from: file(rootProject.file('module.gradle'))

android {
    namespace 'zygisk.il2cppdumper'
    compileSdk rootProject.ext.targetSdkVersion
    ndkVersion '25.2.9519653'
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        externalNativeBuild {
            cmake {
                arguments "-DMODULE_NAME:STRING=$moduleLibraryName"
            }
        }
    }
    buildFeatures {
        prefab true
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

repositories {
    mavenLocal()
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def variantCapped = variant.name.capitalize()
        def variantLowered = variant.name.toLowerCase()

        def zipName = "${magiskModuleId.replace('_', '-')}-${moduleVersion}-${variantLowered}.zip"
        def magiskDir = file("$outDir/magisk_module_$variantLowered")

        tasks.register("prepareMagiskFiles${variantCapped}", Sync) {
            dependsOn("assemble$variantCapped")

            def templatePath = "$rootDir/template/magisk_module"

            into magiskDir
            from(templatePath) {
                exclude 'module.prop'
            }
            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : magiskModuleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: moduleDescription,
                ])
                filter(FixCrLfFilter.class,
                        eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            doLast {
                def zygiskDir = file("$magiskDir/zygisk")
                zygiskDir.mkdirs()
                def nativeLibraries = fileTree("$buildDir/intermediates").matching {
                    include "**/lib${moduleLibraryName}.so"
                }.files.findAll { library ->
                    ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"].contains(library.parentFile.name)
                }
                if (nativeLibraries.isEmpty()) {
                    throw new GradleException("Native library lib${moduleLibraryName}.so was not packaged")
                }
                nativeLibraries.groupBy { it.parentFile.name }.each { abi, libraries ->
                    def library = libraries.find { it.path.contains("stripped_native_libs") } ?: libraries[0]
                    Files.copy(library.toPath(), file("$zygiskDir/${abi}.so").toPath(),
                            StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }

        tasks.register("zip${variantCapped}", Zip) {
            dependsOn("prepareMagiskFiles${variantCapped}")
            from magiskDir
            archiveFileName.set(zipName)
            destinationDirectory.set(outDir)
        }

        tasks.register("push${variantCapped}", Exec) {
            dependsOn("zip${variantCapped}")
            workingDir outDir
            commandLine android.adbExecutable, "push", zipName, "/data/local/tmp/"
        }

        tasks.register("flash${variantCapped}", Exec) {
            dependsOn("push${variantCapped}")
            commandLine android.adbExecutable, "shell", "su", "-c",
                    "magisk --install-module /data/local/tmp/${zipName}"
        }

        tasks.register("flashAndReboot${variantCapped}", Exec) {
            dependsOn("flash${variantCapped}")
            commandLine android.adbExecutable, "shell", "reboot"
        }

        tasks.configureEach {
            if (name == "assemble${variantCapped}") {
                finalizedBy("zip${variantCapped}")
            }
        }
    }
}
